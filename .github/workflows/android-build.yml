name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go mobile tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: android

      - name: Checkout LadderAirport
        uses: actions/checkout@v4
        with:
          repository: Jlan45/LadderAirport
          path: LadderAirport
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/core/go.mod

      - name: Point module replaces at the checkout
        working-directory: android
        run: |
          sed -i "s|/home/jlan/LadderAirport|${GITHUB_WORKSPACE}/LadderAirport|g" core/go.mod

      - name: Test mobile package
        working-directory: android/core
        run: GOWORK=off go test ./mobile/ -count=1
